<html lang='en'>
<head>
    <meta charset='UTF-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1.0'>
    <title>My Website</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header { background-color: #333; color: white; padding: 1em; text-align: center; }
        nav { display: flex; justify-content: space-around; background-color: #444; padding: 0.5em; }
        nav a { color: white; text-decoration: none; padding: 0.5em; }
        main { padding: 2em; }
        footer { background-color: #333; color: white; text-align: center; padding: 1em; position: fixed; bottom: 0; width: 100%; }
        @media (max-width: 700px) {
            nav a { display: block; margin: 0.5em 0; }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Website</h1>
    </header>
    <nav>
        <a href='#'>Home</a>
        <a href='#about'>About</a>
        <a href='#contact'>Contact</a>
    </nav>
    <main>
        <section id='home'>
            <h2>Home</h2>
            <p>This is the home section of my website.</p>
        </section>
        <section id='about'>
            <h2>About</h2>
            <p>This is the about section of my website.</p>
        </section>
        <section id='contact'>
            <h2>Contact</h2>
            <p>This is the contact section of my website.</p>
        </section>
    </main>
    <footer>
        <p>&copy; 2023 My Website. All rights reserved.</p>
    </footer>
</body>
</html>
